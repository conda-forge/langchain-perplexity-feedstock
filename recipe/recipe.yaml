context:
  name: langchain-perplexity
  version: "1.5.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_perplexity-${{ version }}.tar.gz
  sha256: d8e3ee160efb6a155288ce8c805f79940cd2be0751b8e87bbb353e226305056d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.6.12,<2.0.0
    - perplexityai >=0.34.1,<1.0.0

tests:
  - python:
      imports:
        - langchain_perplexity
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: An integration package connecting Perplexity and LangChain
  license: MIT
  license_file: LICENSE
  repository: https://github.com/langchain-ai/langchain/tree/master/libs/partners/perplexity
  homepage: https://reference.langchain.com/python/integrations/langchain_perplexity

extra:
  recipe-maintainers:
    - MridulS
